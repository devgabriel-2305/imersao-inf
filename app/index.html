<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imersão | Técnico em Informática</title>
  <link rel="shortcut icon" href="assets/logo.webp" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Playfair+Display:ital,wght@1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blueblack: "#07111F",
            bluewhite: "#0B1A30",
            bluegreen: "#091522"
          },
          fontFamily: {
            sans:  ['"Space Grotesk"', "system-ui", "sans-serif"],
            serif: ['"Playfair Display"', "Georgia", "serif"],
            copy:  ['"DM Sans"', "system-ui", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-blueblack text-white antialiased">

  <header id="nav"
          class="group fixed inset-x-0 top-2.5 z-10 mx-auto grid h-[3.25rem] w-[calc(100%-1.5rem)] grid-cols-[1fr_auto] grid-rows-1 items-center px-4
                 md:top-5 md:w-[min(86%,1100px)] md:px-6
                 lg:grid-cols-[1fr_auto_1fr]">

    <div class="absolute inset-0 rounded-full border border-white/10 bg-white/15 backdrop-blur-sm lg:animate-expand lg:backdrop-blur-md"></div>

    <a href="#home"
       aria-label="Informática - início"
       class="group/logo relative z-10 flex items-center justify-self-start gap-2.5 animate-fade"
       style="animation-delay:.6s">
      <img src="assets/logo.webp" alt="" width="50" height="50"
           class="size-6 object-contain drop-shadow-[0_2px_6px_rgba(0,0,0,.45)] transition-transform duration-300 ease-out
                  group-hover/logo:-rotate-6 group-hover/logo:scale-110
                  md:size-[2.5rem]">
      <span class="text-sm font-bold tracking-wide transition-colors duration-300 group-hover/logo:text-blue-500">INFORMÁTICA</span>
    </a>

    <nav id="links"
         aria-label="Principal"
         class="relative flex items-center gap-5 text-[.8rem] tracking-wide
                xl:gap-8
                max-lg:invisible max-lg:absolute max-lg:inset-x-0 max-lg:top-[calc(100%+.5rem)] max-lg:-translate-y-1.5 max-lg:flex-col max-lg:items-stretch max-lg:gap-0
                max-lg:rounded-3xl max-lg:bg-neutral-900/90 max-lg:py-2 max-lg:opacity-0 max-lg:transition
                max-lg:group-data-[open]:visible max-lg:group-data-[open]:translate-y-0 max-lg:group-data-[open]:opacity-100">
      <a href="#home"        class="nav-link inline-flex items-center gap-2 whitespace-nowrap max-lg:px-5 max-lg:py-3 lg:animate-fade" style="animation-delay:.8s"><i class="bi bi-house-door" aria-hidden="true"></i>HOME</a>
      <a href="#sobre"       class="nav-link inline-flex items-center gap-2 whitespace-nowrap max-lg:px-5 max-lg:py-3 lg:animate-fade" style="animation-delay:.92s"><i class="bi bi-info-circle" aria-hidden="true"></i>SOBRE</a>
      <a href="#galeria"     class="nav-link inline-flex items-center gap-2 whitespace-nowrap max-lg:px-5 max-lg:py-3 lg:animate-fade" style="animation-delay:1.04s"><i class="bi bi-images" aria-hidden="true"></i>GALERIA</a>
      <a href="#projetos"    class="nav-link inline-flex items-center gap-2 whitespace-nowrap max-lg:px-5 max-lg:py-3 lg:animate-fade" style="animation-delay:1.16s"><i class="bi bi-folder2-open" aria-hidden="true"></i>PROJETOS</a>
      <a href="#disciplinas" class="nav-link inline-flex items-center gap-2 whitespace-nowrap max-lg:px-5 max-lg:py-3 lg:animate-fade" style="animation-delay:1.28s"><i class="bi bi-book" aria-hidden="true"></i>DISCIPLINAS</a>
    </nav>

    <button id="burger"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="links"
            class="relative -mr-3 grid size-11 cursor-pointer place-content-center gap-[5px] justify-self-end animate-fade lg:hidden"
            style="animation-delay:.8s">
      <span class="block h-0.5 w-5 bg-white transition group-data-[open]:translate-y-[3.5px] group-data-[open]:rotate-45"></span>
      <span class="block h-0.5 w-5 bg-white transition group-data-[open]:-translate-y-[3.5px] group-data-[open]:-rotate-45"></span>
    </button>
  </header>

  <main>
    <section id="home"
             class="grid min-h-svh place-items-center bg-[#1d2a24] bg-[linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),url('assets/sesmated-2025.jpeg')] bg-cover bg-center bg-no-repeat px-5 pb-12 pt-28">
      <div class="w-[min(28rem,100%)] text-center">

        <h1>
          <span class="-mb-[.15em] block font-serif text-[length:clamp(1.4rem,6vw,2.1rem)] font-medium italic animate-fade"
                style="animation-delay:1.7s">Técnico em</span>
          <span class="block text-[length:clamp(2rem,11vw,3.3rem)] font-bold leading-[1.1] tracking-[.02em] animate-fade"
                style="animation-delay:1.9s">INFORMÁTICA</span>
        </h1>

        <div class="mb-4 mt-2.5 h-[3px] bg-white animate-grow" style="animation-delay:2.1s"></div>

        <div class="grid grid-cols-1 items-stretch gap-4 md:grid-cols-[minmax(0,11rem)_2px_minmax(0,1fr)]">
          <p class="font-copy text-base leading-relaxed text-white/90 animate-in-left" style="animation-delay:2.5s">
            Aprenda informática, desenvolva novas habilidades e prepare-se para conquistar oportunidades em um mundo cada vez mais digital.
          </p>

          <span class="h-0.5 bg-white animate-fade md:h-auto" style="animation-delay:2.5s"></span>

          <div class="terminal overflow-hidden rounded-lg border border-white/15 bg-[#0a0c0e]/80 text-left animate-in-right"
               style="animation-delay:2.5s"
               aria-label="Mensagem de boas-vindas">
            <div class="flex gap-1.5 bg-white/10 px-2.5 py-2">
              <span class="size-2.5 rounded-full bg-[#ff5f56]"></span>
              <span class="size-2.5 rounded-full bg-[#ffbd2e]"></span>
              <span class="size-2.5 rounded-full bg-[#27c93f]"></span>
            </div>
            <pre class="min-h-[10rem] whitespace-pre-wrap px-3 py-2.5 font-mono text-[.72rem] leading-relaxed text-[#d7ffe0]"><span id="typed"></span><span class="-mb-[.15em] inline-block h-[1em] w-[.55ch] bg-[#27c93f] animate-blink"></span></pre>
          </div>
        </div>

        <a href="#sobre"
           class="mt-6 inline-block rounded-full border-2 border-white px-9 py-3 font-medium transition-colors animate-fade
                  hover:bg-white hover:text-neutral-900"
           style="animation-delay:3.1s">
          Conheça o curso
        </a>

        <ul class="mt-7 flex flex-wrap justify-center gap-2.5 font-copy text-sm" aria-label="Áreas do curso">
          <li class="group/badge inline-flex cursor-default items-center gap-2 rounded-full border border-white/20 bg-white/10 px-3.5 py-1.5 transition duration-300 animate-fade
                     hover:-translate-y-0.5 hover:border-white/40 hover:bg-white/20"
              style="animation-delay:3.3s">
            <i class="bi bi-code-slash text-[#27c93f] transition-transform duration-300 group-hover/badge:scale-125" aria-hidden="true"></i>Programação
          </li>
          <li class="group/badge inline-flex cursor-default items-center gap-2 rounded-full border border-white/20 bg-white/10 px-3.5 py-1.5 transition duration-300 animate-fade
                     hover:-translate-y-0.5 hover:border-white/40 hover:bg-white/20"
              style="animation-delay:3.45s">
            <i class="bi bi-hdd-network text-[#27c93f] transition-transform duration-300 group-hover/badge:scale-125" aria-hidden="true"></i>Redes
          </li>
          <li class="group/badge inline-flex cursor-default items-center gap-2 rounded-full border border-white/20 bg-white/10 px-3.5 py-1.5 transition duration-300 animate-fade
                     hover:-translate-y-0.5 hover:border-white/40 hover:bg-white/20"
              style="animation-delay:3.6s">
            <i class="bi bi-cpu text-[#27c93f] transition-transform duration-300 group-hover/badge:scale-125" aria-hidden="true"></i>Hardware
          </li>
        </ul>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
